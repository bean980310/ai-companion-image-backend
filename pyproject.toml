[project]
name = "ai-companion-image-backend"
version = "0.1.3"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = ["ai-companion-core", "comfyui-python-client", "diffusers", "transformers", "huggingface-hub", "pandas", "torch", "torchvision", "torchaudio", "openai", "google-genai", "xai-sdk", "replicate", "together"]

[build-system]
requires=[
    "setuptools>=80",
    "setuptools-scm>=8",
    "wheel",
    "build",
